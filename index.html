<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="FootballSimulator — a free browser football management simulator.">
<title>FootballSimulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf4ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px;position:sticky;top:0;background:#0b1728ee;backdrop-filter:blur(12px);border-bottom:1px solid #21314a;z-index:5}
h1{margin:0;font-size:28px}header p{margin:5px 0 0;color:#8ea2c0}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:#091426;border-bottom:1px solid #21314a}
button,select{border:1px solid #2a3d5c;background:#14243b;color:#edf4ff;border-radius:9px;padding:10px 13px;cursor:pointer}
button:hover{border-color:#4ed9a5}button.primary{background:#176d55;border-color:#2ca77f}
main{max-width:1350px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#0e1b2e;border:1px solid #21314a;border-radius:14px;padding:16px}.panel{margin-top:18px}
.label{color:#8ea2c0;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.metric{font-size:25px;font-weight:800;margin-top:4px}
h2{font-size:17px;margin:0 0 12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #21314a}th{color:#8ea2c0;font-size:12px}
.managed{background:#123c34}.muted{color:#8ea2c0}.match,.player,.news{border:1px solid #21314a;background:#0b1728;border-radius:9px;padding:11px;margin:8px 0}
.score{font-size:21px;font-weight:800}.commentary{color:#8ea2c0;font-size:12px;margin-top:6px;line-height:1.45}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}.badge{display:inline-block;padding:3px 7px;border-radius:20px;background:#1c2d49;font-size:11px}
#toast{display:none;position:fixed;right:18px;bottom:18px;padding:12px 15px;border-radius:9px;background:#176d55;z-index:10}
@media(max-width:900px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>⚽ FootballSimulator</h1><p id="status">Loading…</p></header>
<nav>
<button class="primary" onclick="simulateMatchday()">▶ Simulate Matchday</button>
<button onclick="finishSeason()">⏩ Finish Season</button>
<button onclick="runCup()">🏆 Run Cup</button>
<button onclick="nextSeason()">📅 Next Season</button>
<button onclick="simulateFive()">⏩⏩ Sim 5 Seasons</button>
<button onclick="saveGame()">💾 Save</button>
<button onclick="loadGame()">↩ Load</button>
<button onclick="newGame()">New Career</button>
</nav>
<main>
<div class="cards" id="metrics"></div>
<div class="grid">
<section>
<div class="panel"><h2>League Table</h2><div style="overflow:auto"><table id="table"></table></div></div>
<div class="panel"><h2>Latest Matches</h2><div id="results"></div></div>
</section>
<aside>
<div class="panel"><h2>Your Club</h2><select id="clubSelect" onchange="selectClub()"></select><div id="club" style="margin-top:12px"></div>
<button style="margin-top:10px" onclick="youth()">🌱 Youth Intake</button>
<button style="margin-top:10px" onclick="upgradeAcademy()">🏫 Academy +</button></div>
<div class="panel"><h2>Top Scorers</h2><div id="scorers"></div></div>
<div class="panel"><h2>Top Assists</h2><div id="assists"></div></div>
<div class="panel"><h2>News</h2><div id="news"></div></div>
</aside></div>
<div class="panel"><h2>Squad</h2><div class="players" id="players"></div></div>
</main>
<div id="toast"></div>
<script>
const TEAM_NAMES=["Northbridge FC", "Riverside United", "Kingsport City", "Eastvale Athletic", "Westhaven Rovers", "Harbor Town", "Redwood FC", "Lakeside Albion", "Capital FC", "Meadow Park", "Stonebridge", "Oakshire"];
let game;

function rng(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function money(x){return "€"+Number(x||0).toFixed(1)+"m"}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(s,bad=false){let x=document.getElementById("toast");x.textContent=s;x.style.background=bad?"#753545":"#176d55";x.style.display="block";setTimeout(()=>x.style.display="none",2200)}

const first=["Alex","Daniel","Leo","Max","Oliver","Noah","Luca","Elias","Lucas","Felix","Jonas","Milo","Theo","Adam","Oscar","Emil"];
const last=["Hansen","Jensen","Nielsen","Andersen","Larsen","Pedersen","Madsen","Eriksen","Johansson","Berg","Rossi","Costa"];
const positions=["GK","CB","CB","LB","RB","CM","CM","AM","LW","RW","ST"];
function makePlayer(i){
  let age=rng(17,32), rating=rng(62,82);
  return {name:first[rng(0,first.length-1)]+" "+last[rng(0,last.length-1)]+" "+(i+1),
    pos:positions[i%positions.length],rating,age,potential:Math.min(94,rating+rng(3,15)),
    morale:rng(65,95),fitness:rng(75,100),goals:0,assists:0,apps:0,wage:+(rating/12).toFixed(1),
    value:+(rating*0.07+rng(1,8)).toFixed(1)}
}
function newState(){
 let teams={};
 TEAM_NAMES.forEach((n,idx)=>{
   teams[n]={name:n,rating:rng(67,83),reputation:rng(55,90),academy:rng(1,3),
    budget:+rng(12,65),balance:+rng(20,100),league:0,cup:0,stadium:["City Arena","Riverside Ground","National Stadium","Park Stadium"][idx%4],
    players:Array.from({length:18},(_,i)=>makePlayer(idx*18+i)),
    p:0,w:0,d:0,l:0,gf:0,ga:0,news:[]};
 });
 return {season:1,matchday:0,managed:TEAM_NAMES[0],teams,results:[],news:[{headline:"Welcome to FootballSimulator",body:"Your career starts now.",season:1,matchday:0}]};
}
function reset(){game=newState();render()}
function selectClub(){game.managed=document.getElementById("clubSelect").value;render()}
function simulateMatchday(){
 if(game.matchday>=TEAM_NAMES.length*2-2){toast("Season complete — advance to the next season.",true);return}
 game.matchday++;
 let names=Object.keys(game.teams), shuffled=[...names].sort(()=>Math.random()-.5), res=[];
 for(let i=0;i<shuffled.length;i+=2){
   let a=game.teams[shuffled[i]],b=game.teams[shuffled[i+1]];
   let hg=Math.max(0,Math.round(rng(0,4)+(a.rating-b.rating)/22)),ag=Math.max(0,Math.round(rng(0,3)+(b.rating-a.rating)/25));
   a.p++;b.p++;a.gf+=hg;a.ga+=ag;b.gf+=ag;b.ga+=hg;
   if(hg>ag){a.w++;b.l++}else if(hg<ag){b.w++;a.l++}else{a.d++;b.d++}
   let scorer=a.players[rng(0,a.players.length-1)];let asst=b.players[rng(0,b.players.length-1)];
   if(hg) {scorer.goals+=hg;scorer.apps++;} if(ag){asst.goals+=ag;asst.apps++}
   if(hg&&ag) a.players[rng(0,17)].assists++; 
   res.push({home:a.name,away:b.name,hg,ag,weather:["Clear","Rain","Windy","Cloudy"][rng(0,3)],
     pot:(hg>=ag?scorer:asst).name, commentary:[
       `${a.name} ${hg}–${ag} ${b.name}`,
       "A hard-fought simulated fixture with chances at both ends.",
       hg>ag?`${a.name} take all three points.`:hg<ag?`${b.name} take all three points.`:"The points are shared."
     ]});
 }
 game.results=res;game.news.unshift({headline:`Matchday ${game.matchday} completed`,body:`${res.length} fixtures simulated.`,season:game.season,matchday:game.matchday});
 render();
}
function finishSeason(){while(game.matchday<TEAM_NAMES.length*2-2)simulateMatchday();toast("Season finished")}
function runCup(){
 let names=[...TEAM_NAMES].sort(()=>Math.random()-.5);let champion=names[0];
 for(let n of names.slice(1)) if(game.teams[n].rating>game.teams[champion].rating&&Math.random()>.25) champion=n;
 game.teams[champion].cup++;game.news.unshift({headline:`${champion} win the cup`,body:"The cup campaign is complete.",season:game.season,matchday:game.matchday});
 toast(`${champion} win the cup`);render();
}
function nextSeason(){
 if(game.matchday<TEAM_NAMES.length*2-2){toast("Finish the league season first.",true);return}
 let standings=getStandings(),champ=standings[0];game.teams[champ.team].league++;
 game.season++;game.matchday=0;game.results=[];
 Object.values(game.teams).forEach(t=>{t.p=t.w=t.d=t.l=t.gf=t.ga=0;t.players.forEach(p=>{p.apps=0;p.goals=0;p.assists=0;p.age++;p.rating=Math.min(94,p.rating+(Math.random()<.5?1:0));p.value=+(p.rating*.07+rng(1,8)).toFixed(1)})});
 game.news.unshift({headline:`Season ${game.season} begins`,body:`${champ.team} were champions last season.`,season:game.season,matchday:0});render();
}
function simulateFive(){for(let s=0;s<5;s++){while(game.matchday<TEAM_NAMES.length*2-2)simulateMatchday();nextSeason()}toast("Five seasons simulated")}
function youth(){
 let t=game.teams[game.managed];let p=makePlayer(1000+rng(1,999));p.age=rng(16,18);p.rating=rng(55,68);p.potential=rng(72,94);t.players.push(p);game.news.unshift({headline:`Youth prospect joins ${t.name}`,body:`${p.name} arrives with potential ${p.potential}.`,season:game.season,matchday:game.matchday});render()
}
function upgradeAcademy(){let t=game.teams[game.managed];if(t.academy>=5){toast("Academy is already max level",true);return}let cost=t.academy*10;if(t.budget<cost){toast("Not enough budget",true);return}t.budget-=cost;t.academy++;toast("Academy upgraded");render()}
function getStandings(){return Object.values(game.teams).map(t=>({team:t.name,p:t.p,w:t.w,d:t.d,l:t.l,gf:t.gf,ga:t.ga,gd:t.gf-t.ga,pts:t.w*3+t.d,budget:t.budget})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)}
function board(kind,id,icon){let arr=[];Object.values(game.teams).forEach(t=>t.players.forEach(p=>arr.push({name:p.name,team:t.name,v:p[kind]})));arr.sort((a,b)=>b.v-a.v);document.getElementById(id).innerHTML=arr.slice(0,8).map((x,i)=>`<div class="news">${icon} <b>${i+1}. ${esc(x.name)}</b><div class="muted">${esc(x.team)} • ${x.v}</div></div>`).join("")}
function render(){
 let t=game.teams[game.managed],st=getStandings();
 document.getElementById("status").textContent=`Season ${game.season} • Matchday ${game.matchday}/${TEAM_NAMES.length*2-2} • Managing ${game.managed} • Leader ${st[0]?.team||"—"}`;
 document.getElementById("metrics").innerHTML=[["Season",game.season],["Matchday",`${game.matchday}/${TEAM_NAMES.length*2-2}`],["Club",game.managed],["Budget",money(t.budget)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join("");
 let sel=document.getElementById("clubSelect"),old=game.managed;sel.innerHTML=TEAM_NAMES.map(n=>`<option>${esc(n)}</option>`).join("");sel.value=old;
 document.getElementById("table").innerHTML="<tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>"+st.map((r,i)=>`<tr class="${r.team===game.managed?"managed":""}"><td>${i+1}</td><td><b>${esc(r.team)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd}</td><td><b>${r.pts}</b></td></tr>`).join("");
 document.getElementById("results").innerHTML=game.results.length?game.results.map(r=>`<div class="match"><b>${esc(r.home)}</b> <span class="score">${r.hg}–${r.ag}</span> <b>${esc(r.away)}</b><div class="muted">${esc(r.weather)} • POTM ${esc(r.pot)}</div><div class="commentary">${r.commentary.map(esc).join("<br>")}</div></div>`).join(""):"<span class='muted'>No matches played yet.</span>";
 document.getElementById("club").innerHTML=`<b>${esc(t.name)}</b><div class="muted">${esc(t.stadium)}</div><p>Rating ${t.rating} • Reputation ${t.reputation}<br>Academy ${t.academy}/5 • Budget ${money(t.budget)}<br>League titles ${t.league} • Cup titles ${t.cup}</p>`;
 document.getElementById("players").innerHTML=t.players.sort((a,b)=>b.rating-a.rating).map(p=>`<div class="player"><b>${esc(p.name)}</b><br><span class="muted">${p.pos} • Age ${p.age} • OVR ${p.rating} • POT ${p.potential}</span><br>⚽ ${p.goals} • 🎯 ${p.assists} • Apps ${p.apps}<br>Value ${money(p.value)}</div>`).join("");
 board("goals","scorers","⚽");board("assists","assists","🎯");
 document.getElementById("news").innerHTML=game.news.slice(0,8).map(n=>`<div class="news"><b>${esc(n.headline)}</b><div class="muted">S${n.season} M${n.matchday}</div><div class="muted">${esc(n.body)}</div></div>`).join("");
}
function saveGame(){localStorage.setItem("footballsimulator_save",JSON.stringify(game));toast("Career saved in this browser")}
function loadGame(){let x=localStorage.getItem("footballsimulator_save");if(!x){toast("No save found",true);return}game=JSON.parse(x);render();toast("Career loaded")}
function newGame(){if(confirm("Start a new career?")){reset();saveGame()}}
reset();
</script>
</body>
</html>
